[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sayless"
version = "0.1.0"
description = "Local voice assistant - STT and LLM with offline queuing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SayLess Team"},
]
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=0.10.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
]
llm = [
    "litert-lm>=0.18.0",
]
tools = [
    "googlemaps>=4.10.0",
    "phonenumbers>=8.13.0",
]
all = [
    "sayless[stt,llm,tools]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
sayless = "sayless.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sayless"]
